version: 2

# This site is deployed from the repo, so dependency updates land here rather
# than in a published package. Both ecosystems are grouped into a single weekly
# PR per ecosystem: the runtime dependency set is small, and one PR per bump
# would be more review than signal.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Majors are excluded on purpose: a major arriving inside a group PR
      # titled "4 updates" reads as routine, and the one bump that needs a
      # migration is the one that gets skimmed. TypeScript 7 landed that way
      # once and took CI red. Majors still get a PR — just their own.
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pinned action versions go stale silently — nothing in the build fails when
  # `actions/checkout@v5` is a major behind, it just stops getting fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
