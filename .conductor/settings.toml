"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "main_dir=\"$(cd \"$(git rev-parse --git-common-dir)/..\" && pwd)\" && cp \"$main_dir/.env\" . && bun install && bun run scripts/workspace.ts provision"
# Registers nothing to tear down — there is no per-workspace database — but the
# hook stays wired so a future workspace resource has a place to clean up.
archive = "bun run scripts/workspace.ts destroy"
# Safe because provision gives every workspace its own port. Without it, two
# workspaces running `bun run dev` fight over 3000.
run_mode = "concurrent"

[tasks.Run]
available_in = "local"
command = "bun run dev"
default = true
icon = "play"

[tasks.Test]
command = "bun run test"
icon = "test-tube"
